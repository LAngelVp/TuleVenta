[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers --strict-config -p no:pytest-qt
markers =
    unit: Pruebas sin Qt ni conexiones a base de datos.
    db: PostgreSQL de prueba autorizado y esquema desechable por prueba.
    qt: Qt aislado; habilitar con -p pytestqt.plugin.
    concurrency: Dos sesiones independientes sobre PostgreSQL de prueba.